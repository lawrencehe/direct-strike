<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>靶场 v0.3</title>
  <link rel="icon" href="data:,">  <!-- 没有图标文件，免得浏览器去请求 favicon.ico 报 404 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 抬头显示（HUD） -->
  <div id="hud">
    <div id="damage-flash"></div>
    <div id="damage-dir"><i></i></div>

    <div id="crosshair">
      <i class="ch-top"></i><i class="ch-bottom"></i><i class="ch-left"></i><i class="ch-right"></i>
    </div>
    <div id="hitmarker"></div>
    <div id="reload-tip">换弹中…</div>

    <div id="wave-info"></div>
    <div id="banner"></div>

    <div id="stats">
      <div class="battle-only">击杀 <b id="stat-kills">0</b></div>
      <div>射击 <b id="stat-shots">0</b></div>
      <div>命中 <b id="stat-hits">0</b></div>
      <div>爆头 <b id="stat-heads">0</b></div>
      <div>命中率 <b id="stat-acc">0%</b></div>
    </div>

    <div id="health">
      <span class="label">生命</span><span id="health-val">100</span>
      <div class="bar"><i id="health-bar"></i></div>
    </div>

    <div id="ammo"><span id="ammo-cur">30</span><span id="ammo-max">/ ∞</span></div>
    <div id="hint"></div>
  </div>

  <!-- 开始 / 暂停 / 结算界面 -->
  <div id="overlay">
    <div class="panel">
      <h1>靶场 <small>v0.3</small></h1>
      <p id="overlay-sub">选择模式开始</p>
      <div id="overlay-result"></div>
      <!-- 按键表由 hud.js 根据当前绑定生成，点击按键名可以改键 -->
      <div class="keys-head">
        <span>按键（点击可改）</span>
        <a id="btn-keys-reset" href="#">恢复默认</a>
      </div>
      <table class="keys" id="keys"></table>
      <button id="btn-resume">继续</button>
      <div class="mode-btns">
        <button id="btn-range">训练场</button>
        <button id="btn-duel">1v1 对决</button>
        <button id="btn-waves">波次</button>
      </div>
      <div id="loading"></div>
    </div>
  </div>

  <!-- 按依赖顺序加载：先库，再配置，最后主循环 -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/SkeletonUtils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/truck.js"></script>
  <script src="js/world.js"></script>
  <script src="js/targets.js"></script>
  <script src="js/character.js"></script>
  <script src="js/player.js"></script>
  <script src="js/gunmodel.js"></script>
  <script src="js/weapon.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
