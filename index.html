<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct-Strike</title>
  <meta name="description" content="Direct-Strike：打开浏览器就能玩的第一人称射击游戏，1v1 对决、波次、训练场。">
  <meta property="og:title" content="Direct-Strike">
  <meta property="og:description" content="打开浏览器就能玩的第一人称射击游戏，1v1 对决、波次、训练场。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://game.lightup.host/">
  <meta property="og:image" content="https://game.lightup.host/assets/brand/og-image.png">
  <link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 抬头显示（HUD） -->
  <div id="hud">
    <div id="flash-white"></div>
    <div id="damage-flash"></div>
    <div id="damage-dir"><i></i></div>

    <div id="crosshair">
      <i class="ch-top"></i><i class="ch-bottom"></i><i class="ch-left"></i><i class="ch-right"></i>
    </div>
    <div id="hitmarker"></div>
    <div id="reload-tip">换弹中…</div>
    <div id="cook-bar"><i></i></div>

    <div id="wave-info"></div>
    <div id="banner"></div>

    <div id="stats">
      <div class="battle-only">击杀 <b id="stat-kills">0</b></div>
      <div>射击 <b id="stat-shots">0</b></div>
      <div>命中 <b id="stat-hits">0</b></div>
      <div>爆头 <b id="stat-heads">0</b></div>
      <div>命中率 <b id="stat-acc">0%</b></div>
    </div>

    <div id="health">
      <span class="label">生命</span><span id="health-val">100</span>
      <div class="bar"><i id="health-bar"></i></div>
    </div>

    <div id="weapons"></div>
    <div id="ammo"><span id="ammo-cur">30</span><span id="ammo-max">/ ∞</span></div>
    <div id="hint"></div>
  </div>

  <!-- 开始 / 暂停 / 结算界面 -->
  <div id="overlay">
    <div class="panel">
      <img class="logo" src="assets/brand/logo.png" alt="" width="200" height="110">
      <h1>Direct-Strike <small>v0.12</small></h1>
      <p id="overlay-sub">选择模式开始</p>
      <div id="overlay-result"></div>
      <!-- 按键表由 hud.js 根据当前绑定生成，点击按键名可以改键 -->
      <div class="keys-head">
        <span>按键（点击可改）</span>
        <a id="btn-keys-reset" href="#">恢复默认</a>
      </div>
      <table class="keys" id="keys"></table>
      <button id="btn-resume">继续</button>
      <div class="mode-btns">
        <button id="btn-range">训练场</button>
        <button id="btn-duel">1v1 对决</button>
        <button id="btn-waves">波次</button>
      </div>
      <!-- 对决的获胜杀数，选项由 hud.js 按 config.duel.winScoreOptions 生成 -->
      <div class="duel-len"><span>1v1 先到</span><span id="duel-len"></span><span>杀获胜</span></div>
      <div id="loading"></div>
    </div>
  </div>

  <!-- 按依赖顺序加载：先库，再配置，最后主循环 -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/meshopt_decoder.js"></script>
  <script src="vendor/SkeletonUtils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/truck.js"></script>
  <script src="js/world.js"></script>
  <script src="js/targets.js"></script>
  <script src="js/ragdoll.js"></script>
  <script src="js/character.js"></script>
  <script src="js/player.js"></script>
  <script src="js/gunmodel.js"></script>
  <script src="js/grenades.js"></script>
  <script src="js/weapon.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
